version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /apps/ticketing-api
      - /apps/knowledge-api
      - /apps/creditnote-api
      - /apps
      - /agents
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /apps/ticketing-api
      - /apps/knowledge-api
      - /apps/creditnote-api
    schedule:
      interval: weekly
